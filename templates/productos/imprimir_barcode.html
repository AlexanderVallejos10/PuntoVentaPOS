<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sticker {{ producto.codigo }}</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: white;
        }

        .sticker {
            width: 50mm;
            height: 30mm;
            padding: 3mm;
            text-align: center;
            box-sizing: border-box;
        }

        .nombre {
            font-size: 9px;
            font-weight: bold;
            line-height: 1.1;
            margin-bottom: 2mm;
        }

        .barcode img {
            width: 42mm;
            height: auto;
        }

        .codigo {
            font-size: 9px;
            font-weight: bold;
            margin-top: 1mm;
        }

        .precio {
            font-size: 11px;
            font-weight: bold;
            margin-top: 1mm;
        }

        @media print {
            @page {
                size: 50mm 30mm;
                margin: 0;
            }

            body {
                margin: 0;
            }
        }
    </style>
</head>

<body onload="window.print()">

    <div class="sticker">

        <div class="nombre">
            {{ producto.nombre|truncatechars:36 }}
        </div>

        <div class="barcode">
            {% if producto.barcode_image %}
                <img
                    src="{{ producto.barcode_image.url }}"
                    alt="{{ producto.codigo }}"
                >
            {% endif %}
        </div>

        <div class="codigo">
            {{ producto.codigo }}
        </div>

        <div class="precio">
            S/ {{ producto.precio_venta }}
        </div>

    </div>

</body>
</html>
