{% extends 'base/base.html' %}

{% block title %}
{% if editar %}
Editar Caja
{% else %}
Nueva Caja
{% endif %}
{% endblock %}

{% block content %}

<div class="container-fluid">

    <div class="card shadow-sm border-0 rounded-4 mx-auto"
         style="max-width:700px;">

        <div class="card-body p-4">

            <h2 class="fw-bold mb-4">

                {% if editar %}
                    Editar Caja
                {% else %}
                    Nueva Caja
                {% endif %}

            </h2>

            <form method="post">

                {% csrf_token %}

                <div class="mb-3">

                    <label class="form-label fw-bold">
                        Nombre de Caja
                    </label>

                    <input
                        type="text"
                        name="nombre"
                        class="form-control"
                        value="{{ caja.nombre|default:'' }}"
                        required
                    >

                </div>

                <div class="mb-3">

                    <label class="form-label fw-bold">
                        Sede
                    </label>

                    <select
                        name="sede"
                        class="form-select"
                        required
                    >

                        <option value="">
                            Seleccione una sede
                        </option>

                        {% for sede in sedes %}

                            <option
                                value="{{ sede.id }}"
                                {% if caja.sede.id == sede.id %}
                                selected
                                {% endif %}
                            >
                                {{ sede.nombre }}
                            </option>

                        {% endfor %}

                    </select>

                </div>

                <div class="form-check mb-4">

                    <input
                        type="checkbox"
                        class="form-check-input"
                        name="activa"
                        id="activa"
                        {% if caja.activa or not editar %}
                        checked
                        {% endif %}
                    >

                    <label
                        class="form-check-label"
                        for="activa"
                    >
                        Caja activa
                    </label>

                </div>

                <div class="d-flex gap-2">

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Guardar
                    </button>

                    <a
                        href="{% url 'ventas:caja_list' %}"
                        class="btn btn-secondary"
                    >
                        Volver
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
